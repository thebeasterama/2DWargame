<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#171b18" />
  <title>Iron Front</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="maps.css" />
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div><p class="eyebrow">TACTICAL COMMAND</p><h1>IRON FRONT</h1></div>
      <div class="round-panel"><span>ROUND</span><strong id="round">1</strong></div>
    </header>
    <section class="map-toolbar" aria-label="Map selection">
      <label>MAP SCALE
        <select id="mapScale"><option value="city">City</option><option value="state">State</option><option value="country">Country</option><option value="world">World</option></select>
      </label>
      <label class="place-picker">LOCATION<select id="location" aria-label="Map location"></select></label>
      <span id="mapStatus" role="status" aria-live="polite">Loading map…</span>
    </section>
    <section class="game-layout">
      <aside class="panel left-panel">
        <h2>UNIT ROSTER</h2><div id="roster" class="roster"></div>
        <div class="controls"><span><kbd>WASD</kbd> MOVE</span><span><kbd>CLICK</kbd> TARGET</span><span><kbd>SPACE</kbd> ATTACK</span></div>
      </aside>
      <div class="battlefield-wrap">
        <div id="worldMap" aria-label="OpenStreetMap real-world map"></div>
        <canvas id="game" width="960" height="540" aria-label="Iron Front battlefield"></canvas>
        <a class="tile-credit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors</a>
        <div id="banner" class="banner hidden"></div>
      </div>
      <aside class="panel right-panel">
        <h2>FIELD DATA</h2>
        <div class="stat-grid">
          <div><span>UNIT</span><strong id="activeName">—</strong></div><div><span>HEALTH</span><strong id="health">—</strong></div>
          <div><span>AMMO</span><strong id="ammo">—</strong></div><div><span>STATUS</span><strong id="status">READY</strong></div>
        </div>
        <div class="objective"><span>OBJECTIVE</span><p id="objective">ELIMINATE ALL HOSTILES</p></div>
        <div class="theater-card"><span>MAP LOCATION</span><strong id="theaterName">Paris, France</strong><small id="theaterRegion">Île-de-France · France</small></div>
      </aside>
    </section>
    <footer>
      <div class="score"><span>ALLIES</span><strong id="allies">3</strong></div><div class="wave"><span id="phase">DEPLOYMENT PHASE</span></div>
      <div class="score enemy"><span>HOSTILES</span><strong id="enemies">5</strong></div>
    </footer>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="game.js"></script>
  <script src="real-world-map.js"></script>
</body>
</html>
